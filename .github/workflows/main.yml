name: Swift Package Tests

on:
  push:
    branches: ["main", "epic/animation"]
  # Every pull request, also one on the branch of another pull request, whose base changes to main or epic/animation
  # when the other one is merged. That change doesn't run the workflow, so the checks of its first run are kept.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Finds whether a pull request changes the files that the tests and the documentation use. A pull request that
  # changes none of them, such as one that only changes README.md, skips the tests and the documentation, and one
  # that only changes the DocC catalogs skips the tests. `ci-required` succeeds for them. Pushes, runs by hand and
  # pull requests on other pull requests always run everything.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.changes.outputs.test }}
      documentation: ${{ steps.changes.outputs.documentation }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find whether the tests and the documentation change
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            printf 'test=true\ndocumentation=true\n' >> "$GITHUB_OUTPUT"
          elif [ "$BASE_REF" != main ] && [ "$BASE_REF" != epic/animation ]; then
            # The changes from the branch of the other pull request don't tell what changes from main or
            # epic/animation, which the base changes to.
            printf 'test=true\ndocumentation=true\n' >> "$GITHUB_OUTPUT"
          else
            scripts/changes-code.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test on iOS (Xcode 27.0)
    needs: changes
    if: needs.changes.outputs.test == 'true'
    # Xcode 27 is only available on the xcode-27 image for now.
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Xcode 27.0
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'

      # The simulator boots while the tests build, which takes minutes after it boots too.
      - name: Boot the simulator
        run: scripts/test-in-simulator.sh --boot

      - name: Run xcodebuild tests (iOS)
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/test-results
        # Warnings in the package's code fail the build. Remote dependencies are built without warnings.
        run: scripts/test-in-simulator.sh tests clean SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # With one thread in the cooperative thread pool, a rendering that never lets other tasks run keeps the
      # tests from cancelling it on time. The tests of the views cancel renderings and time them out, so only they
      # run again.
      - name: Run xcodebuild tests with one thread in the cooperative pool (iOS)
        if: ${{ !cancelled() }}
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/test-results
          TEST_RUNNER_LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: scripts/test-in-simulator.sh tests-one-thread -only-testing:SVGUIViewTests SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Report failed tests
        if: ${{ failure() }}
        run: |
          for result in "$RUNNER_TEMP"/test-results/*.xcresult; do
            [ -d "$result" ] || continue
            echo "== $(basename "$result")"
            # GitHub reads %0A in an annotation as a line break.
            xcrun xcresulttool get test-results summary --path "$result" \
              | jq -r '.testFailures[] | "::error title=\(.testIdentifierString)::\(.failureText | gsub("\n"; "%0A"))"'
          done

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results

  # Builds the DocC catalogs the Swift Package Index publishes, so a broken
  # catalog or an unresolvable documentation link fails here rather than
  # silently degrading the hosted documentation.
  documentation:
    name: Build documentation
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    # Xcode 27 is only available on the xcode-27 image for now.
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Xcode 27.0
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'

      - name: Build DocC documentation
        run: ./scripts/build-documentation.sh --strict

  # The one check that the ruleset requires, which always runs, so that a pull request whose tests are skipped can
  # be merged. Renaming the job requires renaming the check in the ruleset too.
  ci-required:
    name: CI Required
    needs: [changes, test, documentation]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the results of the other jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          CHANGES_TEST: ${{ needs.changes.outputs.test }}
          CHANGES_DOCUMENTATION: ${{ needs.changes.outputs.documentation }}
          TEST: ${{ needs.test.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
        run: |
          echo "changes: $CHANGES (test: $CHANGES_TEST, documentation: $CHANGES_DOCUMENTATION)," \
            "test: $TEST, documentation: $DOCUMENTATION"
          # The tests and the documentation are skipped also when finding the changes fails.
          if [ "$CHANGES" != success ]; then
            echo "::error::Finding the changed paths didn't succeed ($CHANGES)"
            exit 1
          fi
          # Each job may be skipped only when the files that it uses don't change.
          check() {
            case "$2" in
              true) allowed=success ;;
              false) allowed=skipped ;;
              *)
                echo "::error::Finding the changed paths gave no result for $1"
                exit 1
                ;;
            esac
            if [ "$3" != "$allowed" ]; then
              echo "::error::The required job $1 didn't succeed ($3)"
              exit 1
            fi
          }
          check test "$CHANGES_TEST" "$TEST"
          check documentation "$CHANGES_DOCUMENTATION" "$DOCUMENTATION"
