name: Swift Package Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test on iOS (Xcode 27.0)
    # Xcode 27 is only available on the xcode-27 image for now.
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Xcode 27.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Run xcodebuild tests (iOS)
        run: |
          # Without pipefail, the exit status of xcpretty hides a failing xcodebuild.
          set -o pipefail
          DESTINATION="platform=iOS Simulator,name=iPhone 17e,OS=27.0"

          echo "Using destination: $DESTINATION"
          mkdir -p "$RUNNER_TEMP/test-results"
          # xcpretty hides the output of Swift Testing, so keep the whole output and the result bundle as well.
          xcodebuild clean test \
            -scheme SVGUIView-Package \
            -destination "$DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/test-results/tests.xcresult" \
            | tee "$RUNNER_TEMP/test-results/tests.log" \
            | xcpretty

      # With one thread in the cooperative thread pool, a rendering that never lets other tasks run keeps the
      # tests from cancelling it on time.
      - name: Run xcodebuild tests with one thread in the cooperative pool (iOS)
        if: ${{ !cancelled() }}
        env:
          TEST_RUNNER_LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SVGUIView-Package \
            -destination "platform=iOS Simulator,name=iPhone 17e,OS=27.0" \
            -resultBundlePath "$RUNNER_TEMP/test-results/tests-one-thread.xcresult" \
            | tee "$RUNNER_TEMP/test-results/tests-one-thread.log" \
            | xcpretty

      - name: Report failed tests
        if: ${{ failure() }}
        run: |
          for result in "$RUNNER_TEMP"/test-results/*.xcresult; do
            [ -d "$result" ] || continue
            echo "== $(basename "$result")"
            # GitHub reads %0A in an annotation as a line break.
            xcrun xcresulttool get test-results summary --path "$result" \
              | jq -r '.testFailures[] | "::error title=\(.testIdentifierString)::\(.failureText | gsub("\n"; "%0A"))"'
          done

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results

  # Builds the DocC catalogs the Swift Package Index publishes, so a broken
  # catalog or an unresolvable documentation link fails here rather than
  # silently degrading the hosted documentation.
  documentation:
    name: Build documentation
    # Xcode 27 is only available on the xcode-27 image for now.
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Xcode 27.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Build DocC documentation
        run: ./scripts/build-documentation.sh --strict
