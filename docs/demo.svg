<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <title>SVGUIView playing animations</title>
  <style>
    @keyframes sky { from { fill: #9fd3f5 } to { fill: #ffd9a8 } }
    @keyframes glow { from { transform: scale(1); opacity: 1 } to { transform: scale(1.15); opacity: 0.75 } }
    @keyframes spin { to { transform: rotate(-360deg) } }
    @keyframes trail { from { stroke-dashoffset: 520 } to { stroke-dashoffset: 0 } }
    .sky { animation: sky 3s ease-in-out infinite alternate }
    .sun { transform-box: fill-box; transform-origin: center; animation: glow 1.5s ease-in-out infinite alternate }
    .small-gear { transform-box: fill-box; transform-origin: center; animation: spin 1.5s linear infinite }
    .trail { stroke-dasharray: 520; animation: trail 6s linear infinite }
  </style>
  <rect class="sky" width="400" height="240"/>
  <circle class="sun" cx="340" cy="52" r="24" fill="#ffb02e"/>
  <path fill="#ffffff" d="M60 80 C55 62 80 52 92 62 C100 44 130 44 136 62 C152 58 162 72 154 84 Z">
    <animate attributeName="d" values="M60 80 C55 62 80 52 92 62 C100 44 130 44 136 62 C152 58 162 72 154 84 Z; M62 80 C52 66 78 50 94 60 C104 38 134 40 138 60 C156 54 166 74 152 84 Z; M60 80 C55 62 80 52 92 62 C100 44 130 44 136 62 C152 58 162 72 154 84 Z" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 20 0; 0 0" dur="6s" repeatCount="indefinite"/>
  </path>
  <path fill="#ffffff" opacity="0.85" d="M230 54 C226 42 244 34 254 42 C262 30 284 32 288 44 C300 42 306 52 300 60 Z">
    <animate attributeName="d" values="M230 54 C226 42 244 34 254 42 C262 30 284 32 288 44 C300 42 306 52 300 60 Z; M228 54 C224 40 246 30 256 40 C266 26 290 30 290 44 C304 40 310 54 302 60 Z; M230 54 C226 42 244 34 254 42 C262 30 284 32 288 44 C300 42 306 52 300 60 Z" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M0 210 C80 180 160 230 240 205 S360 190 400 200 L400 240 L0 240 Z" fill="#5fb36b"/>
  <path class="trail" d="M20 170 C80 60 160 230 220 120 S340 40 390 110" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M-12 -7 L14 0 L-12 7 L-6 0 Z" fill="#e8533f" stroke="#7a2318" stroke-width="1">
    <animateMotion path="M20 170 C80 60 160 230 220 120 S340 40 390 110" dur="6s" rotate="auto" repeatCount="indefinite"/>
  </path>
